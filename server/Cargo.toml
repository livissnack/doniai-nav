[package]
name = "doniai_nav_api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4" }
tokio-cron-scheduler = "0.10"
once_cell = "1.19"
base64 = "0.22"
url = "2.5"
serde_yaml = "0.9"
urlencoding = "2.1"
tower-http = { version = "0.5", features = ["cors", "compression-gzip"] }
argon2 = "0.5"
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["std"] }
captcha = "0.0.9"
flate2 = "1"
tar = "0.4"
zip = { version = "0.6", features = ["deflate"] }
tokio-util = { version = "0.7.19", features = ["io"] }
mime_guess = "2.0.5"
http-range-header = "0.4.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
